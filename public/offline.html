<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <title>Нет связи — Додепчик</title>
  <link rel="icon" href="/icons/favicon-32.png">
  <style>
    html { background: #07130d; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      color: #f3efe2; font: 500 15px/1.45 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, rgba(242, 193, 78, .14), transparent 60%), #07130d;
    }
    .card {
      max-width: 400px; padding: 32px 28px 26px; text-align: center; border-radius: 18px;
      background: rgba(12, 30, 21, .78); border: 1px solid rgba(242, 193, 78, .16);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 {
      margin: 14px 0 8px; font: 800 24px/1.2 "Unbounded", "Manrope", system-ui, sans-serif;
      background: linear-gradient(180deg, #ffe39a 0%, #f2c14e 45%, #d39a2a 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin: 0 0 20px; color: #9fb3a6; }
    button {
      border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
      font: 800 15px/1 inherit; color: #1b1405;
      background: linear-gradient(180deg, #ffe39a 0%, #f2c14e 45%, #d39a2a 100%);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Нет связи с залом</h1>
    <p>Проверь интернет. Если с ним всё в порядке — зал сейчас закрыт, загляни чуть позже.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
  </div>
  <script>
    addEventListener('online', () => location.reload());
    setInterval(() => { if (navigator.onLine) fetch('/manifest.webmanifest', { cache: 'no-store' }).then((r) => r.ok && location.reload(), () => {}); }, 15000);
  </script>
</body>
</html>
