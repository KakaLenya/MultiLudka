<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <title>Технический перерыв — Додепчик</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    html { background: #07130d; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; box-sizing: border-box;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      color: #f3efe2; font: 500 15px/1.45 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(900px 520px at 50% -10%, rgba(242, 193, 78, .16), transparent 60%), #07130d;
    }
    .card {
      width: min(420px, 100%); box-sizing: border-box; padding: 30px 26px 26px; text-align: center; border-radius: 18px;
      background: rgba(12, 30, 21, .78); border: 1px solid rgba(242, 193, 78, .16);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    }
    .chip {
      width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; position: relative;
      background: repeating-conic-gradient(#f2c14e 0 30deg, #c98f22 30deg 60deg);
      box-shadow: 0 0 0 4px rgba(242, 193, 78, .14), 0 10px 24px rgba(0, 0, 0, .4);
      animation: spin 6s linear infinite;
    }
    .chip::after { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: #0f3d26; border: 2px dashed rgba(255, 223, 138, .55); }
    .brand {
      font: 800 30px/1.1 "Unbounded", "Manrope", system-ui, sans-serif;
      background: linear-gradient(180deg, #ffe39a 0%, #f2c14e 45%, #d39a2a 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 14px 0 6px; font: 700 17px/1.3 "Unbounded", "Manrope", system-ui, sans-serif; }
    p { margin: 0; color: #9fb3a6; }
    .status { margin-top: 16px; font-size: 13px; }
    button {
      margin-top: 20px; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer;
      font: 800 14px/1 "Manrope", system-ui, sans-serif; color: #1b1405;
      background: linear-gradient(180deg, #ffe39a 0%, #f2c14e 45%, #d39a2a 100%);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .chip { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="chip" aria-hidden="true"></div>
    <div class="brand">Додепчик</div>
    <h1>Технический перерыв</h1>
    <p>Зал сейчас закрыт или перезапускается. Фишки на месте — страница сама откроется, как только зал вернётся.</p>
    <p class="status" id="status" aria-live="polite">Проверяем каждые 10 секунд…</p>
    <button type="button" id="retry">Проверить сейчас</button>
  </div>
  <script>
    // /healthz service worker не кэширует: ответ ok — значит, зал жив и можно перезагрузиться.
    let busy = false;
    async function check() {
      if (busy) return;
      busy = true;
      try {
        const r = await fetch('/healthz', { cache: 'no-store' });
        const body = r.ok ? await r.json().catch(() => null) : null;
        if (body && body.ok) return location.reload();
      } catch {}
      busy = false;
      document.getElementById('status').textContent = 'Пока закрыто. Проверили в ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    document.getElementById('retry').addEventListener('click', check);
    addEventListener('online', check);
    setInterval(check, 10000);
  </script>
</body>
</html>
