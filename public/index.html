<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Казино-зал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">🎲 Казино-зал</div>
    <div class="me" id="me" hidden>
      <span id="me-name"></span>
      <span class="chips" id="me-balance"></span>
      <button class="link" id="logout" type="button" title="Выйти из этого игрока">выйти</button>
    </div>
    <div class="conn" id="conn" data-state="connecting">подключение…</div>
  </header>

  <main>
    <section class="card login" id="login" hidden>
      <h1>Заходи</h1>
      <p class="muted">Фишки виртуальные. Играем на интерес.</p>
      <form id="login-form" autocomplete="off">
        <input id="name" maxlength="20" placeholder="Твоё имя" required>
        <button type="submit" id="login-btn" disabled>Войти</button>
      </form>
      <p class="error" id="login-error"></p>
    </section>

    <section class="lobby" id="lobby" hidden>
      <div class="main-col">
        <div class="card bonus" id="bonus" hidden>
          <div>
            <h2>Фишки кончились</h2>
            <p class="muted" id="bonus-text"></p>
          </div>
          <button type="button" id="bonus-btn">Забрать</button>
        </div>
        <nav class="tabs">
          <button type="button" class="tab active">📈 Краш</button>
          <button type="button" class="tab" disabled>🎲 Покер на кубиках · скоро</button>
        </nav>

        <section class="card crash" id="crash">
          <div class="history" id="crash-history" aria-label="Последние раунды"></div>
          <div class="stage">
            <canvas id="crash-canvas"></canvas>
            <div class="overlay">
              <div class="mult" id="crash-mult">1.00×</div>
              <div class="phase" id="crash-phase">…</div>
            </div>
          </div>

          <form class="controls" id="crash-form" autocomplete="off">
            <label class="field">
              <span>Ставка</span>
              <input id="bet-amount" type="number" min="10" step="1" inputmode="numeric" value="50">
            </label>
            <div class="quick">
              <button type="button" class="ghost" data-quick="half">½</button>
              <button type="button" class="ghost" data-quick="double">×2</button>
              <button type="button" class="ghost" data-quick="max">макс</button>
            </div>
            <label class="field">
              <span>Автовывод на ×</span>
              <input id="auto-cashout" type="number" min="1.01" max="100" step="0.01" inputmode="decimal" placeholder="нет">
            </label>
            <button type="submit" class="action" id="crash-action" disabled>Поставить</button>
          </form>
          <p class="my-result" id="crash-my"></p>

          <table class="bets">
            <thead><tr><th>Игрок</th><th>Ставка</th><th>Вывод</th></tr></thead>
            <tbody id="crash-bets"></tbody>
          </table>
        </section>
        <p class="error toast" id="toast"></p>
      </div>
      <aside class="side-col">
        <div class="card">
          <h2>Онлайн <span class="count" id="online-count">0</span></h2>
          <ul class="list" id="online-list"></ul>
        </div>
        <div class="card">
          <h2>Рейтинг</h2>
          <ol class="list leaderboard" id="leaderboard"></ol>
        </div>
      </aside>
    </section>
  </main>

  <script src="client.js"></script>
</body>
</html>
